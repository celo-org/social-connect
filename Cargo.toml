[workspace.package]
edition = "2024"
authors = ["Paul Lange <palango@gmx.de>"]
license = "MIT"
rust-version = "1.100"
exclude = ["**/target"]
version = "0.1.0"

[workspace]
members = ["rust/combiner", "rust/signer"]
resolver = "2"

[workspace.dependencies]
alloy = { version = "2.5", features = ["contract", "k256", "provider-http", "rpc-types", "sol-types"] }
alloy-signer = "2.5"
alloy-signer-local = "2.5"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bincode = "1"
dotenvy = "0.15"
futures = "0.3"
hex = "0.4"
http-body-util = "0.1"
k256 = "0.13"
metrics = "0.24"
metrics-exporter-prometheus = "0.16"
moka = "0.12"
reqwest = { version = "0.13", default-features = false }
serde = "1"
serde_json = "1"
sha2 = "0.10"
tempfile = "3"
thiserror = "2"
tokio = "1"
tower = "0.5"
tower-http = "0.6"
tracing = "0.1"
tracing-subscriber = "0.3"
# Pinned to a revision so that `cargo update` cannot move the signing code unnoticed.
threshold-bls = { git = "https://github.com/celo-org/celo-threshold-bls-rs", rev = "20964e5d745d3e4c8ac103c7ac76b25ef8601b8b", package = "threshold-bls" }

[profile.dev]
split-debuginfo = "unpacked"

[profile.release]
lto = true
codegen-units = 1
strip = true
