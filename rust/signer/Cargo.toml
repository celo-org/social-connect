[package]
name = "odis-signer"
edition.workspace = true
authors.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
exclude.workspace = true

[dependencies]
alloy = { workspace = true }
async-trait = { workspace = true }
axum = { workspace = true }
base64 = { workspace = true }
bincode = { workspace = true }
dotenvy = "0.15"
google-cloud-secretmanager-v1 = "1"
hex = { workspace = true }
k256 = { version = "0.13", features = ["ecdsa"] }
moka = { workspace = true, features = ["future"] }
serde = { workspace = true, features = ["derive"] }
sha2 = "0.10"
serde_json = { workspace = true }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite", "postgres", "tls-rustls"] }
thiserror = { workspace = true }
threshold-bls = { workspace = true }
tokio = { workspace = true, features = ["full"] }
metrics = { workspace = true }
metrics-exporter-prometheus = { workspace = true }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["catch-panic", "limit", "timeout", "trace"] }
tracing = { workspace = true }
tracing-subscriber = { workspace = true, features = ["env-filter", "json"] }

[dev-dependencies]
alloy-signer = "2.5"
alloy-signer-local = "2.5"
http-body-util = "0.1"
rand_chacha = "0.3"
rand_core = "0.6"
tempfile = "3"
testcontainers-modules = { version = "0.15", features = ["postgres"] }
