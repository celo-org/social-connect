[package]
name = "odis-signer"
edition.workspace = true
authors.workspace = true
version.workspace = true
license.workspace = true
rust-version.workspace = true
exclude.workspace = true

[dependencies]
alloy = "2.5"
async-trait = "0.1"
axum = "0.8"
base64 = "0.22"
bincode = "1"
dotenvy = "0.15"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
# Pinned to a revision so that `cargo update` cannot move the signing code unnoticed.
threshold-bls = { git = "https://github.com/celo-org/celo-threshold-bls-rs", rev = "20964e5d745d3e4c8ac103c7ac76b25ef8601b8b", package = "threshold-bls" }
tokio = { version = "1", features = ["full"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["catch-panic", "limit", "timeout", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
http-body-util = "0.1"
rand_chacha = "0.3"
rand_core = "0.6"
