name: Rust CI

on:
  push:
    branches: [main]
    paths:
      - "rust/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "justfile"
      - ".config/nextest.toml"
      - ".github/workflows/rust-signer.yml"
  pull_request:
    paths:
      - "rust/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - "rust-toolchain.toml"
      - "justfile"
      - ".config/nextest.toml"
      - ".github/workflows/rust-signer.yml"

concurrency:
  group: rust-signer-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Build + Format + Clippy + Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: dtolnay/rust-toolchain@1.100.0
        with:
          components: rustfmt, clippy

      - uses: extractions/setup-just@v2

      - uses: taiki-e/install-action@nextest

      - uses: Swatinem/rust-cache@v2

      - run: just build
      - run: just fmt-check
      - run: just clippy
      - run: just check-tls
      # Docker is available on ubuntu-latest, so the Postgres/ETL and differential
      # testcontainers tests run for real. Require them so they can never silently skip.
      - run: just test
        env:
          ODIS_REQUIRE_POSTGRES_TESTS: "1"
          ODIS_REQUIRE_DIFFERENTIAL_TESTS: "1"
