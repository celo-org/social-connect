---
name: Build ODIS Rust combiner image

# Builds only when an input of dockerfiles/Dockerfile-combiner-rs changes.
#
# A release is a git tag named odis-rs-combiner-<version>. The prefix must not
# start with odis-combiner-, which the TS combiner's release tags use.
on:
  push:
    paths:
      - 'dockerfiles/Dockerfile-combiner-rs'
      - 'rust/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/odis-combiner-rs-container.yml'
    branches:
      - main
    tags:
      - 'odis-rs-combiner-*'
  pull_request:
    paths:
      - 'dockerfiles/Dockerfile-combiner-rs'
      - 'rust/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/odis-combiner-rs-container.yml'
  workflow_dispatch:

jobs:
  odis-combiner-rs-build-dev:
    uses: celo-org/reusable-workflows/.github/workflows/docker-build.yaml@v3.1
    name: Build Rust combiner image (dev-images/odis-combiner)
    if: |
      github.ref != 'refs/heads/main' && !startsWith(github.ref, 'refs/tags/')
    permissions:
      actions: read
      contents: write
      pull-requests: write
      security-events: write
      attestations: write
      id-token: write
    with:
      workload-id-provider: projects/1094498259535/locations/global/workloadIdentityPools/gh-social-connect/providers/github-by-repos
      service-account: 'social-connect-dev@devopsre.iam.gserviceaccount.com'
      artifact-registry: us-west1-docker.pkg.dev/devopsre/dev-images/odis-combiner
      tags: rs-${{ github.sha }}
      context: .
      file: dockerfiles/Dockerfile-combiner-rs
      # TODO: turn the image scan on. It is off in every image workflow in this repo.
      trivy-enabled: false

  odis-combiner-rs-build:
    uses: celo-org/reusable-workflows/.github/workflows/docker-build.yaml@v3.1
    name: Build Rust combiner image (social-connect/odis-combiner)
    if: |
      github.ref == 'refs/heads/main'
    permissions:
      actions: read
      contents: write
      pull-requests: write
      security-events: write
      attestations: write
      id-token: write
    with:
      workload-id-provider: projects/1094498259535/locations/global/workloadIdentityPools/gh-social-connect-main/providers/github-by-repos
      service-account: 'social-connect@devopsre.iam.gserviceaccount.com'
      artifact-registry: us-west1-docker.pkg.dev/devopsre/social-connect/odis-combiner
      tags: rs-${{ github.sha }}
      context: .
      file: dockerfiles/Dockerfile-combiner-rs
      # TODO: turn the image scan on. It is off in every image workflow in this repo.
      trivy-enabled: false

  odis-combiner-rs-tag:
    uses: celo-org/reusable-workflows/.github/workflows/docker-build.yaml@v3.1
    name: Build Rust combiner image (social-connect/odis-combiner) tag
    if: |
      startsWith(github.ref, 'refs/tags/odis-rs-combiner-')
    permissions:
      actions: read
      contents: write
      pull-requests: write
      security-events: write
      attestations: write
      id-token: write
    with:
      workload-id-provider: projects/1094498259535/locations/global/workloadIdentityPools/gh-social-connect-tag/providers/github-by-repos
      service-account: 'social-connect@devopsre.iam.gserviceaccount.com'
      artifact-registry: us-west1-docker.pkg.dev/devopsre/social-connect/odis-combiner
      tags: ${{ github.ref_name }}
      context: .
      file: dockerfiles/Dockerfile-combiner-rs
      # TODO: turn the image scan on. It is off in every image workflow in this repo.
      trivy-enabled: false
